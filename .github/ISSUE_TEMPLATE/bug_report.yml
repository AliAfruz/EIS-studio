name: Bug report
description: Report a reproducible software or numerical problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload confidential experimental data, credentials, or identifying information.
  - type: input
    id: version
    attributes:
      label: EIS Gold Studio version
      placeholder: 1.13.2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include circuit, weighting, optimizer, bounds, and locked parameters when relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback or diagnostic output
      render: shell
