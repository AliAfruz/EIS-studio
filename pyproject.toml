[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eis-gold-studio"
version = "1.13.2"
description = "Auditable electrochemical impedance spectroscopy analysis and equivalent-circuit fitting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ali Afruz", email = "a.a.afruz@gmail.com" },
  { name = "Maryam Kaffash Jamshid" }
]
keywords = [
  "electrochemistry",
  "impedance spectroscopy",
  "equivalent circuit",
  "Mott-Schottky",
  "distribution of relaxation times"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
  "PySide6>=6.7",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "openpyxl>=3.1"
]

[project.urls]
Homepage = "https://github.com/AliAfruz/EIS-studio"
Repository = "https://github.com/AliAfruz/EIS-studio.git"
Issues = "https://github.com/AliAfruz/EIS-studio/issues"
Documentation = "https://github.com/AliAfruz/EIS-studio/tree/main/docs"

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]
release = [
  "build>=1.2",
  "twine>=5.0"
]

[project.gui-scripts]
eis-gold-studio = "eis_studio.main_window:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["eis_studio*"]

[tool.setuptools.package-data]
eis_studio = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
